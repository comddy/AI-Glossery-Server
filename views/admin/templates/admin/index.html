{% extends "admin/base.html" %}

{% block title %}数据库管理首页{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>数据库管理面板</h2>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-people fs-1 text-primary"></i>
                <h5 class="card-title mt-2">用户管理</h5>
                <p class="card-text">管理用户账户信息</p>
                <a href="{{ url_for('admin.list_users') }}" class="btn btn-primary">进入管理</a>
            </div>
        </div>
    </div>
    
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-book fs-1 text-success"></i>
                <h5 class="card-title mt-2">单词管理</h5>
                <p class="card-text">管理单词库内容</p>
                <a href="{{ url_for('admin.list_words') }}" class="btn btn-success">进入管理</a>
            </div>
        </div>
    </div>
    
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-database fs-1 text-info"></i>
                <h5 class="card-title mt-2">数据库统计</h5>
                <p class="card-text">查看数据库统计信息</p>
                <a href="#" class="btn btn-info">查看统计</a>
            </div>
        </div>
    </div>
</div>

<div class="mt-4">
    <h4>数据库统计</h4>
    <div class="row">
        {% for stat in model_stats %}
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-title">{{ stat.name }}</h6>
                    <p class="card-text">
                        <span class="badge bg-primary">{{ stat.count }}</span> 条记录
                    </p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
