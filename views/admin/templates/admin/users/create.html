{% extends "admin/base.html" %}

{% block title %}添加用户{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>添加用户</h2>
    <a href="{{ url_for('admin.list_users') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> 返回列表
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="username" class="form-label">用户名 *</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">邮箱 *</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="wechat_openid" class="form-label">微信OpenID</label>
                    <input type="text" class="form-control" id="wechat_openid" name="wechat_openid">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="wechat_session_key" class="form-label">微信Session Key</label>
                    <input type="text" class="form-control" id="wechat_session_key" name="wechat_session_key">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="preferred_classification" class="form-label">学习词书</label>
                    <select class="form-select" id="preferred_classification" name="preferred_classification">
                        <option value="cet4">CET-4</option>
                        <option value="cet6">CET-6</option>
                        <option value="ielts">雅思</option>
                        <option value="toefl">托福</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="preferred_plan_daily" class="form-label">每日计划数量</label>
                    <input type="number" class="form-control" id="preferred_plan_daily" name="preferred_plan_daily" value="20">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="wallet_key" class="form-label">钱包密钥</label>
                    <input type="text" class="form-control" id="wallet_key" name="wallet_key">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="word_power_amount" class="form-label">词力值</label>
                    <input type="number" class="form-control" id="word_power_amount" name="word_power_amount" value="0">
                </div>
            </div>

            <div class="mb-3">
                <label for="word_friend_name" class="form-label">词友名称</label>
                <input type="text" class="form-control" id="word_friend_name" name="word_friend_name" value="robot">
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check"></i> 创建用户
                </button>
                <a href="{{ url_for('admin.list_users') }}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
