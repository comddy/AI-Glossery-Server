<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库管理面板 - {% block title %}首页{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #495057;
            padding: 0.5rem 1rem;
        }
        .sidebar .nav-link:hover {
            background-color: #e9ecef;
        }
        .sidebar .nav-link.active {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2 sidebar p-0">
                <div class="p-3">
                    <h5 class="text-center mb-4">数据库管理</h5>
                    <nav class="nav flex-column">
                        <a class="nav-link {% if request.endpoint == 'admin.index' %}active{% endif %}" href="{{ url_for('admin.index') }}">
                            <i class="bi bi-house"></i> 首页
                        </a>
                        <a class="nav-link {% if request.endpoint == 'admin.list_users' %}active{% endif %}" href="{{ url_for('admin.list_users') }}">
                            <i class="bi bi-people"></i> 用户管理
                        </a>
                        <a class="nav-link {% if request.endpoint == 'admin.list_words' %}active{% endif %}" href="{{ url_for('admin.list_words') }}">
                            <i class="bi bi-book"></i> 单词管理
                        </a>
                        <a class="nav-link {% if request.endpoint == 'admin.list_ai_agents' %}active{% endif %}" href="{{ url_for('admin.list_ai_agents') }}">
                            <i class="bi bi-robot"></i> AI助手管理
                        </a>
                        <a class="nav-link {% if request.endpoint == 'admin.list_chat_messages' %}active{% endif %}" href="{{ url_for('admin.list_chat_messages') }}">
                            <i class="bi bi-chat"></i> 聊天消息管理
                        </a>
                        <a class="nav-link" href="{{ url_for('admin.logout') }}">
                            <i class="bi bi-box-arrow-right"></i> 退出登录
                        </a>
                    </nav>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-md-10">
                <div class="p-4">
                    <!-- 消息提示 -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    {% block content %}
                    {% endblock %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
